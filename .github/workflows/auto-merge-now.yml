name: Auto Merge Now

on:
  push:
    paths:
      - '.github/workflows/auto-merge-now.yml'

jobs:
  merge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure Git
        run: |
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git config --global user.name "github-actions[bot]"

      - name: Fetch all branches
        run: git fetch origin

      - name: Checkout main
        run: git checkout main

      - name: Merge feature branch into main
        run: |
          git merge "flavioalves/codex/2026-07-27/19-14-46/executar-melhorias-tecnicas-do-relatorio-a" --no-edit -m "Merge: Executar melhorias técnicas do relatório"

      - name: Push to main
        run: git push origin main

      - name: Delete feature branch
        run: git push origin --delete "flavioalves/codex/2026-07-27/19-14-46/executar-melhorias-tecnicas-do-relatorio-a"

      - name: Verify branches
        run: |
          echo "Branches remaining:"
          git branch -a
