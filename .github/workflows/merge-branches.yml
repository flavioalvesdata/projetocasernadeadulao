name: Merge Branches

on:
  workflow_dispatch:

jobs:
  merge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config --global user.email "action@github.com"
          git config --global user.name "GitHub Action"

      - name: Fetch all branches
        run: git fetch origin

      - name: Checkout main
        run: git checkout main

      - name: Merge feature branch
        run: |
          git merge flavioalves/codex/2026-07-27/19-14-46/executar-melhorias-tecnicas-do-relatorio-a --no-edit

      - name: Push merged main
        run: git push origin main

      - name: Delete feature branch remotely
        run: git push origin --delete flavioalves/codex/2026-07-27/19-14-46/executar-melhorias-tecnicas-do-relatorio-a || true
