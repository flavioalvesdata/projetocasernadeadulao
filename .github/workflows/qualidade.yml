name: Qualidade técnica
on: [push, pull_request]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qualidade:
    name: Geração, linters e testes
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v4.3.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20.18.0
          cache: npm
      - run: npm ci
      - name: Instalar motores do Playwright
        run: npx playwright install --with-deps chromium firefox webkit
      - name: Verificar artefatos gerados antes da validação
        run: npm run check:generated
      - name: Validar geração, encoding, formato, lint e testes
        run: npm run validate
      - name: Medir cobertura dos testes unitários
        run: npm run test:coverage
      - name: Regressão visual Chromium
        run: npm run test:visual
      - name: Verificar artefatos ou formatação não versionados
        run: git diff --exit-code -- .
      - name: Publicar diagnósticos em caso de falha
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: diagnosticos-playwright
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 14
