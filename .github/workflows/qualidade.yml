name: Qualidade técnica
on: [push, pull_request]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qualidade:
    name: Geração, linters e testes
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Instalar motores do Playwright
        run: npx playwright install --with-deps chromium firefox webkit
      - name: Verificar artefatos gerados antes da validação
        run: npm run check:generated
      - name: Validar geração, encoding, formato, lint e testes
        run: npm run validate
      - name: Regressão visual Chromium
        run: npm run test:visual
      - name: Verificar artefatos ou formatação não versionados
        run: git diff --exit-code -- .
      - name: Publicar diagnósticos em caso de falha
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: diagnosticos-playwright
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 14
